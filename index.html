<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0E1B24"><title>Fat Burner</title>
<style>
:root{--bg:#0E1B24;--sf:#172B3B;--tx:#E6EEF3;--mu:#8CA3B3;--ac:#F2C46D;--ok:#6CC5A6;--ln:#2B4358}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:auto;padding:12px}
.card{background:var(--sf);border-radius:14px;padding:14px;margin:0 0 12px}
h2{margin:0 0 6px;font-size:1.25rem}h3{margin:10px 0 6px;font-size:1rem}.mu{color:var(--mu)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--sf);border:1px solid var(--ln);border-radius:12px;min-height:44px;padding:0 14px}
button.p{background:var(--ac);color:#1a1405;border:0;font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;min-height:44px;padding:0 10px;width:100%}
textarea{padding:10px;min-height:90px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}.row>.s{flex:0 0 auto}
.set input{text-align:center;font-variant-numeric:tabular-nums}
.on{background:var(--ok)!important;color:#06231a!important;border:0!important}
.sel{border:2px solid var(--ac)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:38px;font-size:.88rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0A141B;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);font-size:.78rem;padding:0}nav button.b{color:var(--ac);font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;font-size:.92rem}
.pg{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:var(--ok)}
.win{padding:8px 0;border-bottom:1px solid var(--ln)}.win:last-child{border:0}
.ban{background:#2A2A1C;border:1px solid var(--ac)}
#t{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top));z-index:9;display:flex;flex-direction:column;gap:8px;padding:0 12px;pointer-events:none;max-width:520px;margin:0 auto}
.toast{pointer-events:auto;background:var(--ac);color:#1a1405;border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.toast b{display:block;font-size:1.02rem}
.toast.calm{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .3s ease-out}@keyframes in{from{transform:translateY(-14px);opacity:0}}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><main id="v"></main><div id="t" role="status" aria-live="polite"></div><nav id="n"></nav>
<script>
const KEY='fatburner.v1',FIRST='2026-10-19',WEEKS=20,TABS=['Train','Summary','Body','History','Meals','Shop'];
const D=s=>new Date(s+'T00:00:00'),iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date()),add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>D(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const mon=s=>add(s,-((D(s).getDay()+6)%7));
const wk=(d,st)=>Math.round((D(mon(d))-D(mon(st||S.start)))/6048e5);
const DEF={v:2,start:'2026-10-19',gw:89.5,body:[],log:{},day:{},shop:{},away:{},sess:[],wins:{},notify:false,mode:{},pick:{},day1:'',mig:false};
const norm=o=>Object.assign(JSON.parse(JSON.stringify(DEF)),o||{});
let S=null;try{const raw=localStorage.getItem(KEY),o=JSON.parse(raw);if(o&&o.v===2)S=o;else if(raw)localStorage.setItem(KEY+'.old',raw)}catch(e){}
S=norm(S);
if(!S.body.length)S.body=[{d:'2026-08-24',w:104.8,bf:32.5},{d:'2026-09-19',w:107.4,bf:33.3}];
if(!S.mig){S.mig=true;if(!S.sess.length)Object.keys(S.log).sort().forEach(d=>{if(Object.values(S.log[d].sets||{}).some(a=>a.some(x=>x&&x.done)))S.sess.push({d,t:'Lift',slot:'pm'})})}
if(S.sess.length&&!S.day1){S.day1=S.sess.map(s=>s.d).sort()[0];S.start=mon(S.day1)}
if(!S.sess.length&&!S.day1)S.start=DEF.start;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab=0,cur=today(),ex='';
const PL={
Push:[[['Barbell bench press','DB bench press','Incline DB press'],3,6,8],[['DB shoulder press','Machine shoulder press','Landmine press'],3,8,10],[['Cable lateral raise','DB lateral raise','Machine lateral raise'],3,12,15],[['Rope pushdown','Overhead extension','Assisted dips'],2,10,12]],
Pull:[[['Lat pulldown','Neutral-grip pulldown','Assisted pull-up'],3,8,10],[['Seated cable row','Chest-supported row','1-arm DB row'],3,8,10],[['Face pull','Reverse pec deck','Rear-delt cable fly'],3,12,15],[['DB curl','Hammer curl','Cable curl'],2,10,12]],
Legs:[[['Smith squat','Leg press','Hack squat'],3,6,8],[['Romanian deadlift','DB Romanian deadlift','Hip thrust'],3,8,10],[['Lying leg curl','Seated leg curl','Cable pull-through'],3,10,12],[['Standing calf raise','Seated calf raise','Leg-press calf raise'],3,12,15]],
Full:[[['Goblet squat','Leg press','Split squat'],3,10,12],[['DB bench press','Push-up (loaded)','Machine chest press'],3,10,12],[['Seated cable row','Chest-supported row','1-arm DB row'],3,10,12],[['DB Romanian deadlift','Hip thrust','Cable pull-through'],3,10,12]]};
const ROT=['Push','Pull','Legs','Full'],NM={Push:'Push',Pull:'Pull',Legs:'Legs',Full:'Full-body circuit',Min:'20-minute minimum',Active:'Active day',Lift:'Lift session'};
const TPL={1:'am',2:'pm',3:'pm',4:'am',5:'flex',6:'active',0:'rest'};
const SLT={am:'Morning session',pm:'Night session, 8:30pm',flex:'Flex day: catch up on a missed session, or rest',active:'Active day: swim, golf or a walk with company',rest:'Rest day'};
const isLift=t=>ROT.includes(t)||t==='Lift';
const nLifts=dt=>S.sess.filter(s=>s.d<dt&&isLift(s.t)).length;
const nextLift=()=>ROT[S.sess.filter(s=>isLift(s.t)).length%4];
const tyOf=dt=>{const e=S.sess.find(s=>s.d===dt&&ROT.includes(s.t));return e?e.t:(S.pick[dt]||ROT[nLifts(dt)%4])};
const dm=dt=>S.mode[dt]||({active:'active',rest:'rest'})[TPL[D(dt).getDay()]]||'lift';
function ctx(dt){const w=S.day1?Math.max(0,wk(dt)):0,bl=Math.floor(w/6),L=S.sess.map(s=>s.d).filter(d=>d<dt).sort().pop(),ty=tyOf(dt);
return{w,bl,v:bl%3,dl:w%6===5,ty,p:PL[ty],re:!!L&&(Math.round((D(dt)-D(L))/864e5)>=4||Object.keys(S.away).some(a=>S.away[a]&&a>L&&a<dt))}}
function hist(nm,before){return Object.keys(S.log).sort().filter(d=>d<before&&S.log[d].sets&&S.log[d].sets[nm]).map(d=>S.log[d].sets[nm].filter(x=>x&&x.done&&+x.w)).filter(a=>a.length)}
function target(nm,lo,hi,dt){const h=hist(nm,dt);if(!h.length)return '';const l=h[h.length-1],w=Math.max(...l.map(x=>+x.w)),miss=a=>a.some(x=>+x.r<lo);
if(l.every(x=>+x.r>=hi))return w+2.5;if(h.length>1&&miss(l)&&miss(h[h.length-2]))return Math.round(w*.925/2.5)*2.5;return w}
function lg(dt,nm){S.log[dt]=S.log[dt]||{sets:{}};return S.log[dt].sets[nm]=S.log[dt].sets[nm]||[]}
function set(nm,k,f,v){const a=lg(cur,nm);a[k]=a[k]||{};a[k][f]=v;save()}
function prog(dt){const c=ctx(dt);let tot=0,dn=0;c.p.forEach(([nm,ns])=>{const n=nm[c.v],k=(c.dl||c.re)?Math.ceil(ns/2):ns;tot+=k;const a=(S.log[dt]&&S.log[dt].sets[n])||[];dn+=a.slice(0,k).filter(x=>x&&x.done).length});return{tot,dn}}
const slotNow=()=>cur===today()?(new Date().getHours()>=16?'pm':'am'):(TPL[D(cur).getDay()]==='am'?'am':'pm');
function addSess(t,extra){if(S.sess.some(s=>s.d===cur&&s.t===t&&(!extra||s.k===extra.k)))return;S.sess.push(Object.assign({d:cur,t,slot:slotNow()},extra||{}));if(!S.day1){S.day1=cur;S.start=mon(cur)}save()}
function tick(nm,k,lo,wid,rid){const a=lg(cur,nm);a[k]=a[k]||{};if(!a[k].done){a[k].w=document.getElementById(wid).value;a[k].r=document.getElementById(rid).value||String(lo)}a[k].done=!a[k].done;save();
const p=prog(cur);if(a[k].done&&p.tot&&p.dn>=p.tot&&!S.sess.some(s=>s.d===cur&&isLift(s.t))){const t=tyOf(cur);addSess(t);toast(NM[t]+' logged','Every set ticked. Next up: '+NM[nextLift()]+'.')}checkWins();r()}
function finish(t){if(!prog(cur).dn){toast('Nothing ticked yet','Tick at least one set, or use the 20-minute minimum.');return}addSess(t);toast(NM[t]+' logged','Next up: '+NM[nextLift()]+'.');checkWins();r()}
function logMin(){addSess('Min');toast('20 minutes logged','Showing up small counts. Next full session: '+NM[nextLift()]+'.');checkWins();r()}
function logActive(k){addSess('Active',{k});toast(k+' logged','That counts as a session.');checkWins();r()}
function undo(i){S.sess.splice(i,1);save();r()}
function setMode(m){S.mode[cur]=m;save();r()}
function pick(t){S.pick[cur]=t;save();r()}
function go(n){cur=add(cur,n);r()}
const byWeek=()=>{const g={};S.sess.forEach(s=>{const k=mon(s.d);g[k]=(g[k]||0)+1});return g};
const bestRun=m=>{const g=byWeek(),ks=Object.keys(g).sort();let run=0,best=0;if(ks.length)for(let k=ks[0];k<=ks[ks.length-1];k=add(k,7)){if((g[k]||0)>=m){run++;best=Math.max(best,run)}else run=0}return best};
const curRun=()=>{const g=byWeek();let k=mon(today()),n=0;if((g[k]||0)<3)k=add(k,-7);while((g[k]||0)>=3){n++;k=add(k,-7)}return n};
const volume=()=>Object.values(S.log).reduce((t,l)=>t+Object.values(l.sets||{}).flat().reduce((a,x)=>a+(x&&x.done?(+x.w||0)*(+x.r||0):0),0),0);
const prs=()=>{const best={};let n=0;Object.keys(S.log).sort().forEach(d=>Object.entries(S.log[d].sets||{}).forEach(([nm,a])=>{const m=Math.max(0,...a.filter(x=>x&&x.done&&+x.r>0).map(x=>+x.w||0));if(m>0){if(best[nm]&&m>best[nm])n++;best[nm]=Math.max(best[nm]||0,m)}}));return n};
const fullBest=()=>{const g={};S.sess.forEach(s=>{const k=mon(s.d);g[k]=g[k]||{l:0,a:0};if(s.t==='Active')g[k].a++;else if(isLift(s.t))g[k].l++});return Math.max(0,...Object.values(g).map(x=>Math.min(x.l,4)+Math.min(x.a,1)))};
const comeback=()=>{const ds=[...new Set(S.sess.map(s=>s.d))].sort();for(let i=1;i<ds.length;i++)if((D(ds[i])-D(ds[i-1]))/864e5>=4)return 1;return 0};
const WINS=[
{id:'d1',t:'Day 1',d:'Log your first session',p:()=>[S.sess.length,1]},
{id:'min',t:'Small counts',d:'Finish a 20-minute minimum session',p:()=>[S.sess.filter(s=>s.t==='Min').length,1]},
{id:'both',t:'Both sides',d:'Train once in the morning and once at night',p:()=>[['am','pm'].filter(x=>S.sess.some(s=>s.slot===x)).length,2]},
{id:'act',t:'Out and about',d:'Log an active day: swim, golf or a walk with company',p:()=>[S.sess.filter(s=>s.t==='Active').length,1]},
{id:'w3',t:'Three-session week',d:'Log 3 sessions in one week, Monday to Sunday',p:()=>[Math.max(0,...Object.values(byWeek())),3]},
{id:'pr',t:'First PR',d:'Lift heavier than your previous best on any exercise',p:()=>[prs(),1]},
{id:'v10',t:'10,000 kg lifted',d:'Total weight moved across every set you log',p:()=>[Math.round(volume()),10000]},
{id:'back',t:'Comeback',d:'Train again after 3 or more days off',p:()=>[comeback(),1]},
{id:'s10',t:'Ten sessions',d:'Ten sessions logged',p:()=>[S.sess.length,10]},
{id:'run2',t:'Two good weeks',d:'Two weeks in a row with 3 or more sessions',p:()=>[bestRun(3),2]},
{id:'full',t:'Full week',d:'4 lifting sessions and 1 active day in the same week',p:()=>[fullBest(),5]},
{id:'v50',t:'50,000 kg lifted',d:'Total weight moved across every set you log',p:()=>[Math.round(volume()),50000]},
{id:'run4',t:'A month of weeks',d:'Four weeks in a row with 3 or more sessions',p:()=>[bestRun(3),4]},
{id:'s20',t:'Twenty sessions',d:'Twenty sessions logged',p:()=>[S.sess.length,20]}];
const nextWin=()=>{let b=null;WINS.forEach(w=>{if(!S.wins[w.id]){const[c,n]=w.p(),q=Math.min(c/n,.99);if(!b||q>b.q)b={t:w.t,d:w.d,c,n,q}}});return b};
const bar=(c,n)=>`<div class=pg role=progressbar aria-valuenow="${c}" aria-valuemin=0 aria-valuemax="${n}"><i style="width:${Math.min(100,c/n*100)}%"></i></div>`;
function toast(a,b,win){const e=document.createElement('div');e.className='toast'+(win?'':' calm');e.innerHTML='<b></b><span></span>';e.firstChild.textContent=a;e.lastChild.textContent=b;e.onclick=()=>e.remove();document.getElementById('t').appendChild(e);setTimeout(()=>e.remove(),win?7000:4500);
if(win){try{navigator.vibrate&&navigator.vibrate([90,50,90])}catch(x){}try{if(S.notify&&window.Notification&&Notification.permission==='granted')new Notification(a,{body:b})}catch(x){}}}
function checkWins(){const got=[];WINS.forEach(w=>{if(!S.wins[w.id]){const[c,n]=w.p();if(c>=n){S.wins[w.id]=today();got.push(w)}}});if(got.length){save();got.forEach(w=>toast('Win unlocked: '+w.t,w.d,1))}}
function askNotify(){try{if(!window.Notification){toast('Not available here','This browser cannot show phone alerts. The in-app banners still work.');return}Notification.requestPermission().then(p=>{S.notify=p==='granted';save();r();toast(S.notify?'Phone alerts on':'Phone alerts blocked',S.notify?'They appear while the tracker is open.':'Allow notifications for this site in your browser settings.')})}catch(e){}}
function strip(){const m=mon(cur);let h='<div class=chips style="justify-content:space-between;margin-bottom:10px">';for(let i=0;i<7;i++){const d=add(m,i),done=S.sess.some(s=>s.d===d);h+=`<button class="${done?'on ':''}${d===cur?'sel':''}" style="min-width:42px;padding:0 6px" onclick="cur='${d}';r()" aria-label="${fmt(d)}${done?', done':''}">${'MTWTFSS'[i]}${done?'✓':''}</button>`}return h+'</div>'}
function Train(){const dt=cur,away=S.away[dt],dn=S.sess.filter(s=>s.d===dt),mode=dm(dt),c=ctx(dt),tp=TPL[D(dt).getDay()],wn=byWeek()[mon(dt)]||0;
let h=`<div class=bar><button onclick="go(-1)" aria-label="Previous day">‹</button><b>${fmt(dt)}${dt===today()?' · today':''}</b><button onclick="go(1)" aria-label="Next day">›</button></div>`+strip();
if(!S.sess.length)h+=`<div class=card><h2>Day 1 is your first session</h2><p class=mu>Planned: ${today()<FIRST?fmt(FIRST)+', morning session':'today'}. Day 1 is whichever day you log session one, so you can never start late.</p></div>`;
const nw=nextWin();if(nw)h+=`<div class=card><span class=mu>Next win</span><br><b>${nw.t}</b> <span class=mu>${nw.d}</span>${bar(nw.c,nw.n)}</div>`;
const L=S.sess.map(s=>s.d).sort().pop(),gap=L?Math.round((D(today())-D(L))/864e5):0;
if(dt===today()&&!dn.length&&gap>=2)h+=`<div class="card ban"><b>${gap>=4?'Welcome back.':'A gap is just a gap.'}</b><br>${gap>=4?'Today is a half-size session. That is how everyone restarts, and it counts as a win.':'Today only needs the 20-minute minimum. The one thing to avoid is missing twice in a row.'}</div>`;
if(dn.length)return h+`<div class=card><h2>Done</h2>${dn.map(s=>`<p>${NM[s.t]}${s.k?' · '+s.k:''} <span class=mu>${s.slot==='am'?'morning':'night'}</span> <button style="min-height:34px" onclick="undo(${S.sess.indexOf(s)})">Undo</button></p>`).join('')}<p class=mu>${wn} of 3 sessions this week. Next full session: ${NM[nextLift()]}.</p></div>`;
const title=away?'Away':mode==='lift'?NM[c.ty]:mode==='min'?NM.Min:mode==='active'?NM.Active:'Rest day';
h+=`<div class=card><h2>${title}</h2><span class=mu>${SLT[tp]} · ${wn} of 3 this week</span><br><span class=mu>Week ${c.w+1} of ${WEEKS} · Block ${c.bl+1} ${c.dl?'· Deload week (half the sets, stop ~3 reps short)':c.re?'· Re-entry (half the sets, easy weights)':'· Build week '+(c.w%6+1)+' of 5'}</span>
<div class=chips style="margin-top:10px">${[['lift','Full session'],['min','20-minute minimum'],['active','Active day'],['rest','Rest']].map(([m,t])=>`<button class="${mode===m?'on':''}" onclick="setMode('${m}')">${t}</button>`).join('')}<button class="${away?'on':''}" onclick="S.away[cur]=!S.away[cur];save();r()">${away?'Away: on':'Mark away'}</button></div></div>`;
if(away)return h+`<div class=card><p class=mu>Enjoy the trip. When you are back, your first session is half-size and the 20-minute minimum always counts.</p></div>`;
if(mode==='rest')return h+`<div class=card><p>Rest day. Nothing to log.</p></div>`;
if(mode==='min')return h+`<div class=card><h3>20 minutes, any way you like</h3><p class=mu>Two lifts at 2 sets each, a brisk walk or a bike ride all count. On a low-energy day this keeps the habit alive.</p><button class=p onclick="logMin()">I did my 20 minutes</button></div>`;
if(mode==='active')return h+`<div class=card><h3>What did you do?</h3><div class=chips>${['Swim','Golf','Zone 2 (45 min)','Walk with someone','Other'].map(k=>`<button onclick="logActive('${k}')">${k}</button>`).join('')}</div><p class=mu>Tap one to log it as a session.</p></div>`;
h+=`<div class=card><p class=mu>Lifts take about 35 minutes at RIR 1–2 (1–2 reps left in the tank). Optional: 10 minutes of incline walking after.</p><div class=chips>${ROT.map(t=>`<button class="${c.ty===t?'on':''}" onclick="pick('${t}')">${NM[t]}</button>`).join('')}</div></div>`;
c.p.forEach(([nm,ns,lo,hi],xi)=>{const n=nm[c.v],cnt=(c.dl||c.re)?Math.ceil(ns/2):ns,t=target(n,lo,hi,dt),hs=hist(n,dt),l=hs[hs.length-1],best=Math.max(0,...hs.flat().map(x=>+x.w)),a=(S.log[dt]&&S.log[dt].sets[n])||[];
h+=`<div class=card><h3>${n} <span class=mu>${cnt}×${lo}–${hi}</span></h3><div class=mu style="font-size:.85rem">${l?'Last '+l.map(x=>x.w+'×'+x.r).join(', ')+' · Best '+best+' kg':'No history yet. Pick a weight that leaves 1–2 reps in reserve.'}${t?' · Target '+t+' kg':''}</div>`;
for(let k=0;k<cnt;k++){const s=a[k]||{};h+=`<div class="row set"><input id="w${xi}_${k}" inputmode=decimal placeholder="kg" value="${s.w||t}" onchange="set('${n}',${k},'w',this.value)" aria-label="Weight set ${k+1}"><input id="r${xi}_${k}" inputmode=numeric placeholder="${lo}–${hi}" value="${s.r||''}" onchange="set('${n}',${k},'r',this.value)" aria-label="Reps set ${k+1}"><button class="s ${s.done?'on':''}" style="width:56px" onclick="tick('${n}',${k},${lo},'w${xi}_${k}','r${xi}_${k}')" aria-label="Done set ${k+1}">${s.done?'✓':'○'}</button></div>`}
h+='</div>'});
return h+`<button class=p style="width:100%" onclick="finish('${c.ty}')">Finish session</button>`}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function wavg(){const g={};S.body.forEach(e=>{if(e.w){const k=wk(e.d);(g[k]=g[k]||[]).push(+e.w)}});return Object.keys(g).map(Number).sort((a,b)=>a-b).map(k=>[k,avg(g[k])])}
function Summary(){cur=today();const wn=byWeek()[mon(today())]||0,earned=WINS.filter(w=>S.wins[w.id]),open=WINS.filter(w=>!S.wins[w.id]).map(w=>{const[c,n]=w.p();return{w,c,n,q:Math.min(c/n,.99)}}).sort((a,b)=>b.q-a.q).slice(0,3);
const wa=wavg().filter(([k])=>k>=0),last=[...S.body].filter(e=>e.w).sort((a,b)=>a.d<b.d?-1:1).pop(),bf=[...S.body].filter(e=>e.bf).sort((a,b)=>a.d<b.d?-1:1).pop();
let msg='Log a weigh-in each morning. Judge the weekly average, not single days.';
if(wa.length>2){const d1=wa[wa.length-2][1]-wa[wa.length-1][1],d0=wa[wa.length-3][1]-wa[wa.length-2][1];msg=d1<.5&&d0<.5?'Under 0.5 kg/week for 2 weeks: cut ~150 kcal or add steps.':d1>1.1?'Above the safe ~0.9 kg/week pace: hold calories and watch your lifts.':'Loss is on pace. Keep going.'}
else if(wa.length===2){const d=wa[0][1]-wa[1][1];msg=`Last week's average moved ${d.toFixed(1)} kg. Aim for 0.5–0.9 kg/week.`}
return `<div class=card><h2>This week: ${wn} of 3</h2>${bar(wn,3)}<p class=mu>${wn>=3?'Win week secured. Anything more is a bonus.':'Three sessions makes a win week. The 20-minute minimum counts.'}</p><p class=mu>Weeks in a row with 3+ sessions: ${curRun()}</p></div>
<div class=card><h3>Next wins</h3>${open.length?open.map(o=>`<div class=win><b>${o.w.t}</b> <span class=mu>${o.w.d}</span><div class=mu style="font-size:.85rem">${o.c.toLocaleString()} of ${o.n.toLocaleString()}</div>${bar(o.c,o.n)}</div>`).join(''):'<p>Every win unlocked. Time to add new ones.</p>'}</div>
<div class=card><h3>Earned (${earned.length} of ${WINS.length})</h3>${earned.length?earned.map(w=>`<div class=win><b>${w.t}</b> <span class=mu>${fmt(S.wins[w.id])}</span></div>`).join(''):'<p class=mu>Your first win is one session away.</p>'}</div>
<div class=card><h3>Body trend</h3><p>${msg}</p><p>${last?last.w+' kg':'—'}${bf?' · '+bf.bf+'% body fat':''}</p><p class=mu>Goal ${S.gw} kg at 20% · ${last?(last.w-S.gw).toFixed(1)+' kg to go':''}</p></div>
<div class=card><h3>Weekly averages</h3>${wa.length?`<table>${wa.map(([k,a])=>`<tr><td>Week ${k+1}</td><td>${a.toFixed(1)} kg</td></tr>`).join('')}</table>`:'<p class=mu>Your first weekly average appears after a week of weigh-ins.</p>'}</div>
<div class=card><h3>Daily targets</h3><p>1,900 kcal · 170 g protein · 65 g fat · 160 g carbs<br><span class=mu>9–10k steps · 7 h sleep</span></p></div>`}
function addBody(){const g=id=>document.getElementById(id).value;if(!g('bw'))return;S.body.push({d:g('bd')||today(),w:+g('bw'),bf:+g('bb')||'',wa:+g('bc')||''});save();r()}
function Body(){return `<div class=card><h2>Log</h2><div class=row><input id=bd type=date value="${today()}" aria-label="Date"></div><div class=row><input id=bw inputmode=decimal placeholder="Weight kg"><input id=bc inputmode=decimal placeholder="Waist cm"><input id=bb inputmode=decimal placeholder="Body fat %"></div><button class=p onclick="addBody()">Save entry</button></div>
<div class=card><table>${[...S.body].sort((a,b)=>a.d<b.d?1:-1).map(e=>`<tr><td>${fmt(e.d)}</td><td>${e.w} kg</td><td>${e.bf?e.bf+'%':''}</td><td>${e.wa?e.wa+' cm':''}</td><td><button aria-label="Delete" onclick="S.body.splice(S.body.indexOf(S.body.find(x=>x.d==='${e.d}'&&x.w===${e.w})),1);save();r()">×</button></td></tr>`).join('')}</table></div>
<div class=card><h3>Win alerts</h3><p class=mu>A banner and a buzz appear when you unlock a win. Phone notifications only work while the tracker is open, and some phones do not allow them.</p><div class=row><button onclick="askNotify()">${S.notify?'Phone alerts: on':'Turn on phone alerts'}</button><button class="s" onclick="toast('Win unlocked: Test','This is how a win looks.',1)">Test</button></div></div>
<div class=card><h3>Goals</h3><label class=mu>Program start (set by your first session; blocks and deloads shift with it)</label><div class=row><input type=date value="${S.start}" onchange="S.start=this.value;save();r()"></div><label class=mu>Goal weight kg</label><div class=row><input inputmode=decimal value="${S.gw}" onchange="S.gw=+this.value||89.5;save()"></div></div>`}
function History(){const ds=[...S.sess].sort((a,b)=>a.d<b.d?1:-1),nm=[...new Set(Object.values(S.log).flatMap(l=>Object.keys(l.sets||{})))];
if(!ex&&nm.length)ex=nm[0];let ch='';
if(ex){const pts=Object.keys(S.log).sort().map(d=>[d,Math.max(0,...((S.log[d].sets[ex]||[]).filter(x=>x&&x.done).map(x=>+x.w)))]).filter(p=>p[1]);
if(pts.length>1){const mx=Math.max(...pts.map(p=>p[1])),mn=Math.min(...pts.map(p=>p[1])),sp=mx-mn||1;ch=`<svg viewBox="0 0 300 100" style="width:100%"><polyline fill=none stroke="#F2C46D" stroke-width=3 points="${pts.map((p,i)=>(i/(pts.length-1)*290+5)+','+(90-(p[1]-mn)/sp*80)).join(' ')}"/></svg><div class=mu>${mn}–${mx} kg over ${pts.length} sessions</div>`}else ch='<p class=mu>Log two sessions to see a chart.</p>'}
return `<div class=card><h2>Sessions</h2>${ds.length?`<table>${ds.map(s=>`<tr><td>${fmt(s.d)}</td><td>${NM[s.t]}${s.k?' · '+s.k:''}</td><td>${s.slot==='am'?'Morning':'Night'}</td></tr>`).join('')}</table>`:'<p class=mu>Nothing logged yet.</p>'}</div>
<div class=card><h3>Exercise progress</h3>${nm.length?`<select onchange="ex=this.value;r()">${nm.map(n=>`<option ${n===ex?'selected':''}>${n}</option>`).join('')}</select>${ch}`:'<p class=mu>Tick sets on the Train tab first.</p>'}</div>
<div class=card><h3>Backup</h3><textarea id=bk readonly aria-label="Backup data">${JSON.stringify(S)}</textarea><div class=row><button onclick="bk.select();navigator.clipboard&&navigator.clipboard.writeText(bk.value)">Copy backup</button></div><textarea id=rs placeholder="Paste a backup here"></textarea><button onclick="try{const o=JSON.parse(rs.value);if(o.v===2){S=norm(o);save();r()}}catch(e){alert('That backup could not be read.')}">Restore</button></div>`}
const LU=[['A','Chicken rice bowl','700 kcal · 60 g protein'],['B','Chicken and egg salad sandwich','620 kcal · 58 g'],['C','Beef and lentil chilli with rice','600 kcal · 55 g']],SN=[['1','Whey yoghurt bowl','230 kcal · 32 g'],['2','Cottage cheese, eggs and carrot','290 kcal · 29 g']];
function Meals(){const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return `<div class=card><h2>Work lunches and 4pm snacks</h2><p class=mu>Dinner is cooked separately: protein first. Sunday is batch prep. Eating window 1pm–7pm.</p></div>
<div class=card><h3>Lunch</h3>${LU.map(m=>`<p><b>${m[0]}. ${m[1]}</b><br><span class=mu>${m[2]}</span></p>`).join('')}<h3>Snack</h3>${SN.map(m=>`<p><b>${m[0]}. ${m[1]}</b><br><span class=mu>${m[2]}</span></p>`).join('')}</div>
<div class=card><h3>Week rotation</h3><table>${[1,2,3,4,5,6,0].map((d,i)=>`<tr><td>${dn[d]}</td><td>Lunch ${LU[i%3][0]}</td><td>Snack ${SN[i%2][0]}</td></tr>`).join('')}</table></div>`}
const SH=[['Chicken breast 1.5 kg',15.5],['Lean beef mince 500 g',6.5],['Tinned lentils ×2',3.6],['Tinned tomatoes ×2',2.6],['Rice 1 kg',3],['Eggs ×18',7],['Wholemeal bread',3.5],['Cottage cheese 500 g',5],['Greek yoghurt 1 kg',5.5],['Whey (weekly share of tub)',9],['Carrots 1 kg',2.5],['Salad mix',3],['Onion, garlic, spices',2]];
function Shop(){const t=SH.reduce((s,i)=>s+i[1],0);return `<div class=card><h2>Weekly shop · about $${t.toFixed(0)}</h2><p class=mu>Covers 7 lunches and 7 snacks. Prices are estimates.</p>${SH.map((i,k)=>`<div class=row><button class="${S.shop[k]?'on':''}" onclick="S.shop[${k}]=!S.shop[${k}];save();r()" style="text-align:left">${S.shop[k]?'✓ ':''}${i[0]} <span class=mu>$${i[1].toFixed(2)}</span></button></div>`).join('')}<button onclick="S.shop={};save();r()">Clear ticks</button></div>`}
function r(){document.getElementById('v').innerHTML=[Train,Summary,Body,History,Meals,Shop][tab]();document.getElementById('n').innerHTML=TABS.map((t,i)=>`<button class="${i===tab?'b':''}" onclick="tab=${i};r()">${t}</button>`).join('')}
r();checkWins();
</script></body></html>
