</style></head><body><main id="v"></main><div id="t" role="status" aria-live="polite"></div><nav id="n"></nav>
<script>
const KEY='fatburner.v1',FIRST='2026-10-26',WEEKS=20,TABS=['Summary','Week','Body','History'];
const D=s=>new Date(s+'T00:00:00'),iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date()),add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>D(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const mon=s=>add(s,-((D(s).getDay()+6)%7));
const wk=(d,st)=>Math.round((D(mon(d))-D(mon(st||S.start)))/6048e5);
const DEF={v:2,rst:'',start:'2026-10-26',gw:89.5,body:[],log:{},day:{},shop:{},away:{},sess:[],wins:{},notify:false,mode:{},pick:{},day1:'',mig:false};
const norm=o=>Object.assign(JSON.parse(JSON.stringify(DEF)),o||{});
let S=null;try{const raw=localStorage.getItem(KEY),o=JSON.parse(raw);if(o&&o.v===2)S=o;else if(raw)localStorage.setItem(KEY+'.old',raw)}catch(e){}
S=norm(S);
if(!S.body.length)S.body=[{d:'2026-08-24',w:104.8,bf:32.5},{d:'2026-09-19',w:107.4,bf:33.3}];
if(!S.mig){S.mig=true;if(!S.sess.length)Object.keys(S.log).sort().forEach(d=>{if(Object.values(S.log[d].sets||{}).some(a=>a.some(x=>x&&x.done)))S.sess.push({d,t:'Lift',slot:'pm'})})}
if(!S.bs){S.bs=1;if(!S.body.some(e=>e.d==='2026-10-25'))S.body.push({d:'2026-10-25',w:107,bf:34.2})}
if(S.rst!==FIRST){S.rst=FIRST;if(S.day1&&S.day1<FIRST){S.sess=[];S.wins={};S.day1='';S.away={};S.mode={}}}
if(S.sess.length&&!S.day1){S.day1=S.sess.map(s=>s.d).sort()[0];S.start=mon(S.day1)}
if(!S.sess.length&&!S.day1)S.start=DEF.start;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab=0,cur=today(),ex='',openDay=false,wkM=null,fromTab=1;
const PL={
Push:[[['Barbell bench press','DB bench press','Incline DB press'],3,6,8],[['DB shoulder press','Machine shoulder press','Landmine press'],3,8,10],[['Machine lateral raise','DB lateral raise','Seated DB lateral raise'],3,12,15],[['Rope pushdown','Overhead extension','Assisted dips'],2,10,12]],
Pull:[[['Lat pulldown','Neutral-grip pulldown','Assisted pull-up'],3,8,10],[['Seated cable row','Chest-supported row','1-arm DB row'],3,8,10],[['Face pull','Reverse pec deck','Rear-delt cable fly'],3,12,15],[['DB curl','Hammer curl','Cable curl'],2,10,12]],
Legs:[[['Smith squat','Leg press','Hack squat'],3,6,8],[['Romanian deadlift','DB Romanian deadlift','Hip thrust'],3,8,10],[['Lying leg curl','Seated leg curl','Cable pull-through'],3,10,12],[['Standing calf raise','Seated calf raise','Leg-press calf raise'],3,12,15]],
Full:[[['Goblet squat','Leg press','Split squat'],3,10,12],[['DB bench press','Push-up (loaded)','Machine chest press'],3,10,12],[['Seated cable row','Chest-supported row','1-arm DB row'],3,10,12],[['DB Romanian deadlift','Hip thrust','Cable pull-through'],3,10,12]]};
Object.assign(PL,{
S1:[[['Smith squat','Hack squat','Barbell squat'],3,6,8],[['Barbell bench press','DB bench press','Smith incline press'],3,6,8],[['Lat pulldown','Wide-grip pulldown','Assisted pull-up'],3,8,10],[['Lying leg curl','Seated leg curl','Cable pull-through'],2,10,12],[['Machine lateral raise','DB lateral raise','Seated DB lateral raise'],2,12,15]],
S2:[[['Romanian deadlift','DB Romanian deadlift','Single-leg RDL'],3,8,10],[['DB shoulder press','Machine shoulder press','Landmine press'],3,8,10],[['Seated cable row','Chest-supported row','T-bar row'],3,8,10],[['Standing calf raise','Seated calf raise','Leg-press calf raise'],3,12,15],[['Cable crunch','Machine crunch','Decline sit-up'],2,10,12]],
S3:[[['Leg press','Goblet squat','Split squat'],3,10,12],[['Machine chest press','Cable fly','Pec deck'],3,10,12],[['Face pull','Reverse pec deck','Rear-delt cable fly'],3,12,15],[['DB curl','Hammer curl','Cable curl'],2,10,12],[['Rope pushdown','Overhead extension','Assisted dips'],2,10,12]],
S4:[[['Hip thrust','Cable pull-through','Back extension'],3,10,12],[['DB bench press','Push-up (loaded)','Incline DB press'],3,10,12],[['Neutral-grip pulldown','Single-arm cable pulldown','Chin-up (assisted)'],3,8,10],[['1-arm DB row','Machine row','Cable row (wide grip)'],3,10,12],[['Goblet squat','Split squat','Step-up'],2,10,12]]});
const ROT=['S1','S2','S3','S4'],LEG=['Push','Pull','Legs','Full'],NM={S1:'Session 1: Squat and bench',S2:'Session 2: Hinge and press',S3:'Session 3: Legs, chest and arms',S4:'Session 4: Glutes, pull and push',Push:'Push',Pull:'Pull',Legs:'Legs',Full:'Full-body circuit',Min:'20-minute minimum',Active:'Active day',Lift:'Lift session'};
const TPL={1:'am',2:'pm',3:'pm',4:'am',5:'flex',6:'active',0:'rest'};
const SLT={am:'Morning session',pm:'Night session, 8:30pm',flex:'Flex day: catch up on a missed session, or rest',active:'Active day: swim, golf or a walk with company',rest:'Rest day'};
const WU={
Push:[['Easy bike, rower or incline walk','4 min, until you feel warm'],['Band pull-aparts','2 × 15'],['Arm circles, then scapular push-ups','1 × 10 each'],['Open-book thoracic rotations','1 × 8 per side']],
Pull:[['Easy rower, bike or incline walk','4 min, until you feel warm'],['Band pull-aparts','2 × 15'],['Band external rotations','1 × 12 per arm'],['Cat-cow, then open-book rotations','1 × 8 each']],
Legs:[['Easy bike or incline walk','4 min, until you feel warm'],['Leg swings, front to back','10 per leg'],['Bodyweight squat with a 3-second pause','2 × 8'],['Glute bridges','2 × 10'],["World's greatest stretch",'1 × 4 per side']],
Full:[['Easy rower, bike or incline walk','4 min, until you feel warm'],['Inchworm walk-outs','1 × 6'],["World's greatest stretch",'1 × 4 per side'],['Bodyweight squats and band pull-aparts','2 × 10 and 2 × 15'],['Glute bridges','1 × 10']]};
WU.S1=WU.S2=WU.S3=WU.S4=WU.Full;
const isLift=t=>ROT.includes(t)||LEG.includes(t)||t==='Lift';
const wkLifts=dt=>S.sess.filter(s=>isLift(s.t)&&mon(s.d)===mon(dt)&&s.d<dt).length;
const nextLift=()=>ROT[S.sess.filter(s=>isLift(s.t)&&mon(s.d)===mon(today())).length%4];
function weekPlan(m){let k=0;const t0=today();return [0,1,2,3,4,5,6].map(i=>{const d=add(m,i),tp=TPL[D(d).getDay()],e=S.sess.filter(s=>s.d===d);
if(e.length){if(e.some(x=>isLift(x.t)))k++;return{d,t:e[0].t,k:e[0].k,done:1,tp}}
if(S.away[d])return{d,t:'Away',tp};
const md=dm(d);if(md==='active')return{d,t:'Active',tp};if(md==='rest')return{d,t:'Rest',tp};if(md==='min')return{d,t:'Min',tp};
if(d<t0)return{d,t:tp==='flex'?'Rest':'Missed',tp};
if(k<4)return{d,t:ROT[k++],tp};
return{d,t:'Rest',tp}})}
const tyOf=dt=>{const e=S.sess.find(s=>s.d===dt&&isLift(s.t)&&s.t!=='Lift');if(e)return e.t;const q=weekPlan(mon(dt)).find(x=>x.d===dt);return q&&ROT.includes(q.t)?q.t:ROT[wkLifts(dt)%4]};
const dm=dt=>S.mode[dt]||({active:'active',rest:'rest'})[TPL[D(dt).getDay()]]||'lift';
function ctx(dt){const w=S.day1?Math.max(0,wk(dt)):0,bl=Math.floor(w/6),L=S.sess.map(s=>s.d).filter(d=>d<dt).sort().pop(),ty=tyOf(dt);
return{w,bl,v:bl%3,dl:w%6===5,ty,p:PL[ty],re:!!L&&(Math.round((D(dt)-D(L))/864e5)>=4||Object.keys(S.away).some(a=>S.away[a]&&a>L&&a<dt))}}
function hist(nm,before){return Object.keys(S.log).sort().filter(d=>d<before&&S.log[d].sets&&S.log[d].sets[nm]).map(d=>S.log[d].sets[nm].filter(x=>x&&x.done&&+x.w)).filter(a=>a.length)}
function target(nm,lo,hi,dt){const h=hist(nm,dt);if(!h.length)return '';const l=h[h.length-1],w=Math.max(...l.map(x=>+x.w)),miss=a=>a.some(x=>+x.r<lo);
if(l.every(x=>+x.r>=hi))return w+2.5;if(h.length>1&&miss(l)&&miss(h[h.length-2]))return Math.round(w*.925/2.5)*2.5;return w}
function lg(dt,nm){S.log[dt]=S.log[dt]||{sets:{}};return S.log[dt].sets[nm]=S.log[dt].sets[nm]||[]}
function set(nm,k,f,v){const a=lg(cur,nm);a[k]=a[k]||{};a[k][f]=v;save()}
function prog(dt){const c=ctx(dt);let tot=0,dn=0;c.p.forEach(([nm,ns])=>{const n=nm[c.v],k=(c.dl||c.re)?Math.ceil(ns/2):ns;tot+=k;const a=(S.log[dt]&&S.log[dt].sets[n])||[];dn+=a.slice(0,k).filter(x=>x&&x.done).length});return{tot,dn}}
const slotNow=()=>cur===today()?(new Date().getHours()>=16?'pm':'am'):(TPL[D(cur).getDay()]==='am'?'am':'pm');
function addSess(t,extra){if(S.sess.some(s=>s.d===cur&&s.t===t&&(!extra||s.k===extra.k)))return;S.sess.push(Object.assign({d:cur,t,slot:slotNow()},extra||{}));if(!S.day1){S.day1=cur;S.start=mon(cur)}save()}
function tick(nm,k,lo,wid,rid){const a=lg(cur,nm);a[k]=a[k]||{};if(!a[k].done){a[k].w=document.getElementById(wid).value;a[k].r=document.getElementById(rid).value||String(lo)}a[k].done=!a[k].done;save();
const p=prog(cur);if(a[k].done&&p.tot&&p.dn>=p.tot&&!S.sess.some(s=>s.d===cur&&isLift(s.t))){const t=tyOf(cur);addSess(t);toast(NM[t]+' logged','Every set ticked. Next up: '+NM[nextLift()]+'.')}checkWins();r()}
function finish(t){if(!prog(cur).dn){toast('Nothing ticked yet','Tick at least one set, or use the 20-minute minimum.');return}addSess(t);toast(NM[t]+' logged','Next up: '+NM[nextLift()]+'.');checkWins();r()}
function logMin(){addSess('Min');toast('20 minutes logged','Showing up small counts. Next full session: '+NM[nextLift()]+'.');checkWins();r()}
function logActive(k){addSess('Active',{k});toast(k+' logged','That counts as a session.');checkWins();r()}
function undo(i){S.sess.splice(i,1);save();r()}
function wuTick(i){S.day[cur]=S.day[cur]||{};S.day[cur].wu=S.day[cur].wu||{};S.day[cur].wu[i]=!S.day[cur].wu[i];save();r()}
function setMode(m){S.mode[cur]=m;save();r()}
function pick(t){S.pick[cur]=t;save();r()}
function go(n){cur=add(cur,n);r()}
const byWeek=()=>{const g={};S.sess.forEach(s=>{const k=mon(s.d);g[k]=(g[k]||0)+1});return g};
const bestRun=m=>{const g=byWeek(),ks=Object.keys(g).sort();let run=0,best=0;if(ks.length)for(let k=ks[0];k<=ks[ks.length-1];k=add(k,7)){if((g[k]||0)>=m){run++;best=Math.max(best,run)}else run=0}return best};
const curRun=()=>{const g=byWeek();let k=mon(today()),n=0;if((g[k]||0)<3)k=add(k,-7);while((g[k]||0)>=3){n++;k=add(k,-7)}return n};
const volume=()=>Object.values(S.log).reduce((t,l)=>t+Object.values(l.sets||{}).flat().reduce((a,x)=>a+(x&&x.done?(+x.w||0)*(+x.r||0):0),0),0);
const prs=()=>{const best={};let n=0;Object.keys(S.log).sort().forEach(d=>Object.entries(S.log[d].sets||{}).forEach(([nm,a])=>{const m=Math.max(0,...a.filter(x=>x&&x.done&&+x.r>0).map(x=>+x.w||0));if(m>0){if(best[nm]&&m>best[nm])n++;best[nm]=Math.max(best[nm]||0,m)}}));return n};
const fullBest=()=>{const g={};S.sess.forEach(s=>{const k=mon(s.d);g[k]=g[k]||{l:0,a:0};if(s.t==='Active')g[k].a++;else if(isLift(s.t))g[k].l++});return Math.max(0,...Object.values(g).map(x=>Math.min(x.l,4)+Math.min(x.a,1)))};
const comeback=()=>{const ds=[...new Set(S.sess.map(s=>s.d))].sort();for(let i=1;i<ds.length;i++)if((D(ds[i])-D(ds[i-1]))/864e5>=4)return 1;return 0};
const WINS=[
{id:'d1',t:'Day 1',d:'Log your first session',p:()=>[S.sess.length,1]},
{id:'min',t:'Small counts',d:'Finish a 20-minute minimum session',p:()=>[S.sess.filter(s=>s.t==='Min').length,1]},
{id:'both',t:'Both sides',d:'Train once in the morning and once at night',p:()=>[['am','pm'].filter(x=>S.sess.some(s=>s.slot===x)).length,2]},
{id:'act',t:'Out and about',d:'Log an active day: swim, golf or a walk with company',p:()=>[S.sess.filter(s=>s.t==='Active').length,1]},
{id:'w3',t:'Three-session week',d:'Log 3 sessions in one week, Monday to Sunday',p:()=>[Math.max(0,...Object.values(byWeek())),3]},
{id:'pr',t:'First PR',d:'Lift heavier than your previous best on any exercise',p:()=>[prs(),1]},
{id:'v10',t:'10,000 kg lifted',d:'Total weight moved across every set you log',p:()=>[Math.round(volume()),10000]},
{id:'back',t:'Comeback',d:'Train again after 3 or more days off',p:()=>[comeback(),1]},
{id:'s10',t:'Ten sessions',d:'Ten sessions logged',p:()=>[S.sess.length,10]},
{id:'run2',t:'Two good weeks',d:'Two weeks in a row with 3 or more sessions',p:()=>[bestRun(3),2]},

{id:'v50',t:'50,000 kg lifted',d:'Total weight moved across every set you log',p:()=>[Math.round(volume()),50000]},
{id:'run4',t:'A month of weeks',d:'Four weeks in a row with 3 or more sessions',p:()=>[bestRun(3),4]},
{id:'s20',t:'Twenty sessions',d:'Twenty sessions logged',p:()=>[S.sess.length,20]}];

h+=`<div class=card><div class=eyebrow>Next wins</div>${open.length?open.map(o=>`<div class=win><b>${o.w.t}</b> <span class=mu>${o.w.d}</span><div class="mu sm">${o.c.toLocaleString()} of ${o.n.toLocaleString()}</div>${bar(o.c,o.n)}</div>`).join(''):'<p>Every win unlocked. Time to add new ones.</p>'}${earned.length?`<details style="margin-top:10px"><summary>Earned (${earned.length} of ${WINS.length})</summary>${earned.map(w=>`<div class=win><b>${w.t}</b> <span class=mu>${fmt(S.wins[w.id])}</span></div>`).join('')}</details>`:''}</div>`;
return h}
function addBody(){const g=id=>document.getElementById(id).value;if(!g('bw'))return;S.body.push({d:g('bd')||today(),w:+g('bw'),bf:+g('bb')||'',wa:+g('bc')||''});save();r()}
function Body(){return `<h1>Body</h1><div class=card><h2>Log a weigh-in</h2><div class=row><input id=bd type=date value="${today()}" aria-label="Date"></div><div class=row><input id=bw inputmode=decimal placeholder="Weight kg"><input id=bc inputmode=decimal placeholder="Waist cm"><input id=bb inputmode=decimal placeholder="Body fat %"></div><button class=p onclick="addBody()">Save entry</button></div>
<div class=card><table>${[...S.body].sort((a,b)=>a.d<b.d?1:-1).map(e=>`<tr><td>${fmt(e.d)}</td><td>${e.w} kg</td><td>${e.bf?e.bf+'%':''}</td><td>${e.wa?e.wa+' cm':''}</td><td><button aria-label="Delete" onclick="S.body.splice(S.body.indexOf(S.body.find(x=>x.d==='${e.d}'&&x.w===${e.w})),1);save();r()">×</button></td></tr>`).join('')}</table></div>
<div class=card><h3>Win alerts</h3><p class=mu>A banner and a buzz appear when you unlock a win. Phone notifications only work while the tracker is open, and some phones do not allow them.</p><div class=row><button onclick="askNotify()">${S.notify?'Phone alerts: on':'Turn on phone alerts'}</button><button class="s" onclick="toast('Win unlocked: Test','This is how a win looks.',1)">Test</button></div></div>
<div class=card><h3>Goals</h3><label class=mu>Program start (set by your first session; blocks and deloads shift with it)</label><div class=row><input type=date value="${S.start}" onchange="S.start=this.value;save();r()"></div><label class=mu>Goal weight kg</label><div class=row><input inputmode=decimal value="${S.gw}" onchange="S.gw=+this.value||89.5;save()"></div></div>`}
function History(){const ds=[...S.sess].sort((a,b)=>a.d<b.d?1:-1),nm=[...new Set(Object.values(S.log).flatMap(l=>Object.keys(l.sets||{})))];
if(!ex&&nm.length)ex=nm[0];let ch='';
if(ex){const pts=Object.keys(S.log).sort().map(d=>[d,Math.max(0,...((S.log[d].sets[ex]||[]).filter(x=>x&&x.done).map(x=>+x.w)))]).filter(p=>p[1]);
if(pts.length>1){const mx=Math.max(...pts.map(p=>p[1])),mn=Math.min(...pts.map(p=>p[1])),sp=mx-mn||1;ch=`<svg viewBox="0 0 300 100" style="width:100%"><polyline fill=none stroke="#F2C46D" stroke-width=3 points="${pts.map((p,i)=>(i/(pts.length-1)*290+5)+','+(90-(p[1]-mn)/sp*80)).join(' ')}"/></svg><div class=mu>${mn}–${mx} kg over ${pts.length} sessions</div>`}else ch='<p class=mu>Log two sessions to see a chart.</p>'}
return `<h1>History</h1><div class=card><h2>Sessions</h2>${ds.length?`<table>${ds.map(s=>`<tr><td>${fmt(s.d)}</td><td>${NM[s.t]}${s.k?' · '+s.k:''}</td><td>${s.slot==='am'?'Morning':'Night'}</td></tr>`).join('')}</table>`:'<p class=mu>Nothing logged yet.</p>'}</div>
<div class=card><h3>Exercise progress</h3>${nm.length?`<select onchange="ex=this.value;r()">${nm.map(n=>`<option ${n===ex?'selected':''}>${n}</option>`).join('')}</select>${ch}`:'<p class=mu>Tick sets on a session page first.</p>'}</div>
<div class=card><h3>Backup</h3><textarea id=bk readonly aria-label="Backup data">${JSON.stringify(S)}</textarea><div class=row><button onclick="bk.select();navigator.clipboard&&navigator.clipboard.writeText(bk.value)">Copy backup</button></div><textarea id=rs placeholder="Paste a backup here"></textarea><button onclick="try{const o=JSON.parse(rs.value);if(o.v===2){S=norm(o);save();r()}}catch(e){alert('That backup could not be read.')}">Restore</button></div>`}
function r(){document.getElementById('v').innerHTML=[Summary,openDay&&tab===1?Day:Week,Body,History][tab]();document.getElementById('n').innerHTML=TABS.map((t,i)=>`<button class="${i===tab?'b':''}" onclick="tab=${i};openDay=false;r();window.scrollTo(0,0)">${ICO[i]}${t}</button>`).join('')}
r();checkWins();
</script></body></html>
